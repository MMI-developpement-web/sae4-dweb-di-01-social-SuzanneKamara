name: Deploy CycleB to MMI (FTP Mode)

on:
  push:
    branches: ["CycleB"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. BUILD DU FRONTEND ---
      - name: Install Node & Build Assets
        working-directory: ./frontend
        run: |
          npm install
          npm run build
          mkdir -p public
          cp -r dist/* public/

      # --- 2. ENVOI DES FICHIERS VIA FTP ---
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: mmi.unilim.fr
          username: kamara4
          # Tu dois créer ce secret avec ton MOT DE PASSE habituel du serveur MMI
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Chemin vers ton dossier (le FTP commence souvent à la racine de ton compte)
          server-dir: public_html/SAE4.DWeb-DI.01/CycleB/
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/frontend/node_modules/**
            **/tests/**
