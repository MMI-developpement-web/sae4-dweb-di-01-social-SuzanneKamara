security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
            dev:
                pattern: ^/(_(profiler|wdt)|css|images|js)/
                security: false

            admin:
                pattern: ^/admin
                provider: app_user_provider
                form_login:
                    login_path: admin_login
                    check_path: admin_login
                    default_target_path: admin_dashboard
                    enable_csrf: true
                logout:
                    path: admin_logout
                    target: admin_login

            login:
                pattern: ^/api/login
                stateless: false
                provider: app_user_provider
                user_checker: App\Security\VerifiedUserChecker
                json_login:
                    check_path: api_login_check
                    username_path: email
                    password_path: password

            register:
                pattern: ^/api/users$
                security: false

            verify_email:
                pattern: ^/api/verify-email$
                security: false

            password_reset:
                pattern: ^/api/(request-password-reset|reset-password)$
                security: false

            api:
                pattern: ^/api
                stateless: true
                provider: app_user_provider
                custom_authenticators:
                    - App\Security\ApiTokenAuthenticator
                access_token:
                    token_handler: App\Security\AccessTokenHandler




    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/users/me$, roles: ROLE_USER, methods: [GET] }
        - { path: ^/api/users/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/tweets/explore$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/tweets, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER }